<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC জ্যামিতি সলভার প্রো</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --orange: #f97316; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .app-container { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 340px; background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: var(--primary); color: white; text-align: center; font-weight: bold; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px; }

        .control-panel { background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #cbd5e1; }
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 11px; font-weight: bold; color: #64748b; margin-bottom: 5px; }
        .input-row { display: flex; gap: 8px; }
        .input-row input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .input-label { width: 80px; background: #e2e8f0; }
        .input-val { flex: 1; color: var(--accent); }

        .id-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 20px; }
        .id-btn { padding: 8px 0; border: 1px solid #e2e8f0; background: white; cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .id-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .type-header { font-size: 12px; font-weight: bold; color: var(--primary); margin: 15px 0 8px; border-bottom: 2px solid var(--accent); padding-bottom: 2px; }

        /* Main View */
        .main-content { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; align-items: center; }
        .poster { width: 100%; max-width: 950px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 35px; border: 1px solid #e2e8f0; }
        
        .visual-section { display: grid; grid-template-columns: 1fr 1.2fr; gap: 25px; margin-bottom: 25px; }
        .drawing-box { background: #fafafa; border: 2px dashed #cbd5e1; border-radius: 15px; height: 320px; display: flex; align-items: center; justify-content: center; }
        .stimulus-box { background: #fffaf5; border-left: 6px solid var(--orange); padding: 20px; border-radius: 8px; }
        
        .solution-section { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 25px; }
        .sol-card { margin-bottom: 20px; }
        .sol-card b { color: var(--accent); font-size: 16px; margin-bottom: 10px; display: block; border-bottom: 1px solid #dcfce7; padding-bottom: 5px;}
        .math-text { font-size: 16px; line-height: 1.8; color: #1e293b; }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">⚙️ কাস্টমাইজেশন প্যানেল</div>
        <div class="sidebar-content">
            <div class="control-panel">
                <div class="control-group">
                    <label>প্যারামিটার ১ (যেমন: দৈর্ঘ্য)</label>
                    <div class="input-row">
                        <input type="text" id="nameA" class="input-label" oninput="updateAll()">
                        <input type="number" id="valA" class="input-val" oninput="updateAll()">
                    </div>
                </div>
                <div class="control-group">
                    <label>প্যারামিটার ২ (যেমন: প্রস্থ/কর্ণ)</label>
                    <div class="input-row">
                        <input type="text" id="nameB" class="input-label" oninput="updateAll()">
                        <input type="number" id="valB" class="input-val" oninput="updateAll()">
                    </div>
                </div>
                <div class="control-group">
                    <label>প্যারামিটার ৩ (যেমন: বাহু/দূরত্ব)</label>
                    <div class="input-row">
                        <input type="text" id="nameC" class="input-label" oninput="updateAll()">
                        <input type="number" id="valC" class="input-val" oninput="updateAll()">
                    </div>
                </div>
            </div>
            <div id="navButtons"></div>
        </div>
    </aside>

    <main class="main-content">
        <div class="poster">
            <div style="text-align:center; margin-bottom:20px;">
                <h1 id="topTitle" style="margin:0; font-size:28px;">জ্যামিতি সমাধান</h1>
                <div id="qBadge" style="background:var(--orange); color:white; padding:4px 20px; border-radius:50px; display:inline-block; margin-top:10px; font-weight:bold;">প্রশ্ন নং ১</div>
            </div>

            <div class="visual-section">
                <div class="drawing-box">
                    <svg id="mainSVG" width="400" height="300" viewBox="0 0 400 300"></svg>
                </div>
                <div class="stimulus-box">
                    <h4 style="margin:0 0 10px 0; color:var(--orange);">🔸 উদ্দীপক (Stimulus)</h4>
                    <div id="stimText"></div>
                </div>
            </div>

            <div class="solution-section">
                <h3 style="margin:0 0 15px 0; color:#15803d;">📖 পূর্ণাঙ্গ সমাধান</h3>
                <div class="sol-card"><b>(ক) প্রশ্নের উত্তর:</b> <div id="ansA" class="math-text"></div></div>
                <div class="sol-card"><b>(খ) প্রশ্নের উত্তর:</b> <div id="ansB" class="math-text"></div></div>
                <div class="sol-card"><b>(গ) প্রশ্নের উত্তর:</b> <div id="ansC" class="math-text"></div></div>
            </div>
        </div>
    </main>
</div>

<script>
    let currentID = 1;

    function init() {
        const sections = [
            { name: "রেখা ও কোণ", start: 1, end: 31 },
            { name: "ত্রিভুজ সংক্রান্ত", start: 32, end: 80 },
            { name: "চতুর্ভুজ ও বহুভুজ", start: 81, end: 130 },
            { name: "বৃত্ত সংক্রান্ত", start: 131, end: 170 },
            { name: "ঘনজ্যামিতি", start: 171, end: 200 }
        ];
        const nav = document.getElementById('navButtons');
        sections.forEach(s => {
            nav.innerHTML += `<div class="type-header">${s.name}</div>`;
            let grid = document.createElement('div'); grid.className = 'id-grid';
            for (let i = s.start; i <= s.end; i++) {
                grid.innerHTML += `<button class="id-btn" id="btn-${i}" onclick="loadQuestion(${i})">${i}</button>`;
            }
            nav.appendChild(grid);
        });
        loadQuestion(1);
    }

    function loadQuestion(id) {
        currentID = id;
        document.querySelectorAll('.id-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + id).classList.add('active');

        if (id <= 31) setInputs("কোণ", 32, "অনুপাত১", 5, "অনুপাত২", 4);
        else if (id <= 80) setInputs("ভূমি", 11, "উচ্চতা", 7, "কোণ", 90);
        else if (id <= 130) setInputs("দৈর্ঘ্য", 16, "প্রস্থ", 11, "বাহু", 5);
        else if (id <= 170) setInputs("ব্যাসার্ধ", 12, "জ্যা", 12, "দূরত্ব", 8);
        else setInputs("বাহু", 5, "ব্যাসার্ধ", 3, "উচ্চতা", 7);

        updateAll();
    }

    function setInputs(n1, v1, n2, v2, n3, v3) {
        document.getElementById('nameA').value = n1; document.getElementById('valA').value = v1;
        document.getElementById('nameB').value = n2; document.getElementById('valB').value = v2;
        document.getElementById('nameC').value = n3; document.getElementById('valC').value = v3;
    }

    function updateAll() {
        const id = currentID;
        const nA = document.getElementById('nameA').value;
        const vA = parseFloat(document.getElementById('valA').value) || 0;
        const nB = document.getElementById('nameB').value;
        const vB = parseFloat(document.getElementById('valB').value) || 0;
        const nC = document.getElementById('nameC').value;
        const vC = parseFloat(document.getElementById('valC').value) || 0;

        document.getElementById('qBadge').innerText = "প্রশ্ন নং " + id;
        const svg = document.getElementById('mainSVG'); svg.innerHTML = '';
        const stim = document.getElementById('stimText');

        if (id <= 31) { // টাইপ ১: রেখা
            document.getElementById('topTitle').innerText = "রেখা ও কোণ বিশ্লেষণ";
            stim.innerHTML = `দুটি সমান্তরাল সরলরেখাকে একটি ছেদক ছেদ করায় উৎপন্ন একটি কোণের মান $${nA} = ${vA}^\\circ$। ছেদকের একই পাশের অন্তস্থ কোণ দুটির অনুপাত $${vB}:${vC}$।`;
            svg.innerHTML = `<line x1="50" y1="100" x2="350" y2="100" stroke="#333" stroke-width="3"/><line x1="50" y1="200" x2="350" y2="200" stroke="#333" stroke-width="3"/><line x1="120" y1="50" x2="280" y2="250" stroke="red" stroke-width="2"/><text x="175" y="90" font-weight="bold">${vA}°</text>`;
            document.getElementById('ansA').innerHTML = `$${nA}$ এর পূরক কোণ = $90 - ${vA} = ${90-vA}^\\circ$। সম্পূরক = $180 - ${vA} = ${180-vA}^\\circ$।`;
            document.getElementById('ansB').innerHTML = `একান্তর কোণ জোড়া সমান। অর্থাৎ অপর কোণটিও $${vA}^\\circ$।`;
            let ratioSum = vB + vC;
            document.getElementById('ansC').innerHTML = `কোণ ১ = $\\frac{180}{${ratioSum}} \\times ${vB} = ${(180/ratioSum*vB).toFixed(1)}^\\circ$। কোণ ২ = ${(180/ratioSum*vC).toFixed(1)}^\\circ$।`;
        } 
        else if (id <= 80) { // টাইপ ২: ত্রিভুজ
            document.getElementById('topTitle').innerText = "ত্রিভুজ সংক্রান্ত সমাধান";
            stim.innerHTML = `একটি ত্রিভুজের $${nA} = ${vA}$ সেমি এবং $${nB} = ${vB}$ সেমি। কোণ তিনটির অনুপাত ২:৩:৫।`;
            svg.innerHTML = `<polygon points="200,80 ${200-vA*5},220 ${200+vA*5},220" fill="rgba(37,99,235,0.1)" stroke="blue" stroke-width="2"/>`;
            document.getElementById('ansA').innerHTML = `ত্রিভুজের ক্ষেত্রফল = $\\frac{1}{2} \\times ${vA} \\times ${vB} = ${(0.5*vA*vB).toFixed(2)}$ বর্গ সেমি।`;
            document.getElementById('ansB').innerHTML = `বৃহত্তম কোণ = $180 \\times \\frac{5}{10} = 90^\\circ$। এটি একটি সমকোণী ত্রিভুজ।`;
            document.getElementById('ansC').innerHTML = `অতিভুজ (প্যারামিটার অনুযায়ী) = $\\sqrt{${vA}^2 + ${vB}^2} = ${(Math.sqrt(vA*vA+vB*vB)).toFixed(2)}$ সেমি।`;
        } 
        else if (id <= 130) { // টাইপ ৩: চতুর্ভুজ
            document.getElementById('topTitle').innerText = "চতুর্ভুজ ও বহুভুজ বিশ্লেষণ";
            stim.innerHTML = `একটি আয়তক্ষেত্রের $${nA} = ${vA}$ মিটার এবং $${nB} = ${vB}$ মিটার। একটি সুষম ষড়ভুজের বাহু $${nC} = ${vC}$ সেমি।`;
            svg.innerHTML = `<rect x="${200-vA*5}" y="${150-vB*5}" width="${vA*10}" height="${vB*10}" fill="none" stroke="green" stroke-width="3"/>`;
            document.getElementById('ansA').innerHTML = `আয়তক্ষেত্রের পরিসীমা = $2(${vA} + ${vB}) = ${2*(vA+vB)}$ মিটার। ক্ষেত্রফল = $${vA} \\times ${vB} = ${vA*vB}$ বর্গ মি।`;
            document.getElementById('ansB').innerHTML = `সুষম ষড়ভুজের প্রতিটি অন্তস্থ কোণ = $\\frac{(6-2) \\times 180}{6} = 120^\\circ$। বাহুর দৈর্ঘ্য $${vC}$ সেমি।`;
            // Dynamic Rhombus Calculation
            let rArea = 0.5 * vA * vB; // Using Param 1 and 2 as diagonals
            let rSide = Math.sqrt(Math.pow(vA/2, 2) + Math.pow(vB/2, 2)).toFixed(2);
            document.getElementById('ansC').innerHTML = `রম্বসের কর্ণদ্বয় $${vA}$ ও $${vB}$ হলে, ক্ষেত্রফল = $\\frac{1}{2} \\times ${vA} \\times ${vB} = ${rArea}$ বর্গ সেমি। বাহুর দৈর্ঘ্য = $\\sqrt{(${vA}/2)^2 + (${vB}/2)^2} = ${rSide}$ সেমি।`;
        } 
        else if (id <= 170) { // টাইপ ৪: বৃত্ত
            document.getElementById('topTitle').innerText = "বৃত্তের জ্যা ও ব্যাসার্ধ বিশ্লেষণ";
            stim.innerHTML = `একটি বৃত্তের $${nA} = ${vA}$ সেমি এবং কেন্দ্র থেকে $${nC} = ${vC}$ সেমি দূরত্বে একটি জ্যা $${nB} = ${vB}$ সেমি।`;
            svg.innerHTML = `<circle cx="200" cy="150" r="${vA*7}" fill="none" stroke="orange" stroke-width="3"/><line x1="${200-vB*3}" y1="${150+vC*5}" x2="${200+vB*3}" y2="${150+vC*5}" stroke="black" stroke-width="2"/>`;
            document.getElementById('ansA').innerHTML = `ব্যাস = $2 \\times ${vA} = ${2*vA}$ সেমি। পরিধি = $2\\pi ${vA} = ${(2*Math.PI*vA).toFixed(2)}$ সেমি।`;
            document.getElementById('ansB').innerHTML = `জ্যা এর অর্ধেক = $${vB} / 2 = ${vB/2}$ সেমি। কেন্দ্র থেকে অঙ্কিত লম্ব জ্যা-টিকে সমদ্বিখণ্ডিত করে।`;
            let r_calc = Math.sqrt(vC*vC + Math.pow(vB/2, 2)).toFixed(2);
            document.getElementById('ansC').innerHTML = `পিথাগোরাস মতে, ব্যাসার্ধ $r = \\sqrt{${vC}^2 + (${vB}/2)^2} = \\sqrt{${vC*vC} + ${Math.pow(vB/2,2)}} = ${r_calc}$ সেমি।`;
        }
        else { // টাইপ ৫: ঘনজ্যামিতি
            document.getElementById('topTitle').innerText = "ঘনজ্যামিতি ও পরিমিতি";
            stim.innerHTML = `একটি ঘনকের $${nA} = ${vA}$ সেমি। সিলিন্ডারের ব্যাসার্ধ $${vB}$ এবং উচ্চতা $${vC}$।`;
            svg.innerHTML = `<rect x="150" y="100" width="100" height="100" fill="none" stroke="black" stroke-width="2"/><path d="M150 100 L180 70 M250 100 L280 70 M250 200 L280 170" stroke="black"/>`;
            document.getElementById('ansA').innerHTML = `ঘনকের পৃষ্ঠতলের ক্ষেত্রফল = $6 \\times ${vA}^2 = ${6*vA*vA}$ বর্গ সেমি। আয়তন = $${vA}^3 = ${vA*vA*vA}$ ঘন সেমি।`;
            document.getElementById('ansB').innerHTML = `সিলিন্ডারের বক্রপৃষ্ঠের ক্ষেত্রফল = $2\\pi \\times ${vB} \\times ${vC} = ${(2*Math.PI*vB*vC).toFixed(2)}$ বর্গ সেমি।`;
            document.getElementById('ansC').innerHTML = `সিলিন্ডারের আয়তন = $\\pi \\times ${vB}^2 \\times ${vC} = ${(Math.PI*vB*vB*vC).toFixed(2)}$ ঘন সেমি।`;
        }
        renderMathInElement(document.body, { delimiters: [{left: "$", right: "$", display: false}] });
    }
    window.onload = init;
</script>
</body>
</html>
